name: CI/CD Process
on:
  workflow_call:
  workflow_dispatch:

jobs:
  check-simulations-native:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: windows-2022
            gurobi-slot: 1
          - os: macos-14
            gurobi-slot: 2
          - os: ubuntu-24.04
            gurobi-slot: 1
    runs-on: ${{ matrix.os }}
    concurrency:
      group: gurobi-license-${{ matrix.gurobi-slot }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Create Gurobi license file
        shell: bash
        run: |
          cat <<'EOF' > gurobi.lic
          ${{ secrets.GRB_LICENSE_FILE }}
          EOF
          echo "GRB_LICENSE_FILE=$(pwd)/gurobi.lic" >> $GITHUB_ENV
      - uses: DanySK/build-check-deploy-gradle-action@4.0.32
        with:
          build-command: true
          check-command: ./gradlew check runAllGraphic --no-parallel --max-workers=1
          deploy-command: true
          should-validate-wrapper: ${{ contains('Linux', runner.os) }}
  release:
    needs:
      - check-simulations-native
    runs-on: ubuntu-24.04
    concurrency:
      # Only one release job at a time per branch, as only master releases.
      group: release-${{ github.event.number || github.ref }}
    if: >-
      !github.event.repository.fork
      && (
        github.event_name != 'pull_request'
        || github.event.pull_request.head.repo.full_name == github.repository
      )
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive
          token: ${{ secrets.DEPLOYMENT_TOKEN }}
      - name: Find the version of Node from package.json
        id: node-version
        run: echo "version=$(jq -r .engines.node package.json)" >> $GITHUB_OUTPUT
      - name: Install Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ steps.node-version.outputs.version }}
      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.DEPLOYMENT_TOKEN }}
        run: |
          npm install
          npx semantic-release
  success:
    runs-on: ubuntu-24.04
    needs:
      - check-simulations-native
      - release
    if: >-
      always() && (
        contains(join(needs.*.result, ','), 'failure')
        || !contains(join(needs.*.result, ','), 'cancelled')
      )
    steps:
      - name: Verify that there were no failures
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            exit 1
          fi