incarnation: collektive

variables:
  dataPath: &dataPath "data/different-targets/"
  connectWithinDistance: &connectWithinDistance 10.0
  robotSafeMargin: &robotSafeMargin 2.0
  robotMaxSpeed: &robotMaxSpeed 2.0
#  moveTargetTime1: &moveTargetTime1 20.0
  timeDistribution: &timeDistribution 100.0 # 10 ms
  obstacleRadius: &obstacleRadius 2.0
  obstacleMargin: &obstacleMargin 1.5
  controlPeriodMS: &controlPeriodMS 100.0 #ms
  constraintPrefix:
    formula: |
      "qp"
  logEnabled:
    formula: "false"
  rhoADMM:
    language: kotlin
    formula: 10.0
  rhoResidual:
    language: kotlin
    formula: 0.5
  rhoSlack:
    language: kotlin
    formula: 2.0
  primalTolerance:
    language: kotlin
    formula: 1e-2
  dualTolerance:
    language: kotlin
    formula: 1e-2
  QPSettings: &QPSettings
    language: kotlin
    formula: |
      import it.unibo.collektive.alchemist.device.SimulationQpSettings
      import it.unibo.collektive.admm.Tolerance
      val tolerance = Tolerance(primalTolerance, dualTolerance)
      SimulationQpSettings("qp", false, rhoADMM, rhoResidual, rhoSlack, tolerance)
  seed: &seed
    min: 0
    max: 2
    default: 42
    step: 1

network-model:
  type: ConnectWithinDistance
  parameters: [*connectWithinDistance]

_pool: &program
  - time-distribution: *timeDistribution
    type: Event
    actions:
      - type: RunCollektiveProgram
        parameters: [ it.unibo.collektive.entrypoints.MultipleTargetsKt.multipleTargetEntrypoint ]
      - type: SpeedToTarget
        parameters: [ ]

#environment:
#  type: Continuous2DEnvironment
#  parameters: [ ]
#  global-programs:
#    - time-distribution:
#        type: Trigger
#        parameters: [ *moveTargetTime1 ]
#      type: MoveTarget
#      parameters:
#        - 0.0
#        - 17.0
#        - 1

deployments:
  - type: Point
    parameters: [ 0, 1 ]
    contents:
      - molecule: Robot
        concentration: true
      - molecule: MaxSpeed
        concentration: *robotMaxSpeed
      - molecule: SafeMargin
        concentration: *robotSafeMargin
      - molecule: TargetID
        concentration: 1
      - molecule: TimeDistribution
        concentration: *timeDistribution
      - molecule: ControlPeriodMS
        concentration: *controlPeriodMS
    programs:
      - *program
    properties:
      - type: it.unibo.collektive.alchemist.device.sensors.impl.LocationSensorProperty
      - type: it.unibo.collektive.alchemist.device.sensors.impl.TimeSensorProperty
      - type: it.unibo.collektive.alchemist.device.sensors.impl.SolverProperty
        parameters: [ *QPSettings ]

  - type: Point
    parameters: [ 27, 3 ]
    contents:
      - molecule: Robot
        concentration: true
      - molecule: MaxSpeed
        concentration: *robotMaxSpeed
      - molecule: SafeMargin
        concentration: *robotSafeMargin
      - molecule: TargetID
        concentration: 1
      - molecule: TimeDistribution
        concentration: *timeDistribution
      - molecule: ControlPeriodMS
        concentration: *controlPeriodMS
    programs:
      - *program
    properties:
      - type: it.unibo.collektive.alchemist.device.sensors.impl.LocationSensorProperty
      - type: it.unibo.collektive.alchemist.device.sensors.impl.TimeSensorProperty
      - type: it.unibo.collektive.alchemist.device.sensors.impl.SolverProperty
        parameters: [ *QPSettings ]

  - type: Point
    parameters: [ 13, 0 ]
    contents:
      - molecule: Robot
        concentration: true
      - molecule: MaxSpeed
        concentration: *robotMaxSpeed
      - molecule: SafeMargin
        concentration: *robotSafeMargin
      - molecule: TargetID
        concentration: 2
      - molecule: TimeDistribution
        concentration: *timeDistribution
      - molecule: ControlPeriodMS
        concentration: *controlPeriodMS
    programs:
      - *program
    properties:
      - type: it.unibo.collektive.alchemist.device.sensors.impl.LocationSensorProperty
      - type: it.unibo.collektive.alchemist.device.sensors.impl.TimeSensorProperty
      - type: it.unibo.collektive.alchemist.device.sensors.impl.SolverProperty
        parameters: [ *QPSettings ]

  - type: Point
    parameters: [ 20, 2 ]
    contents:
      - molecule: Robot
        concentration: true
      - molecule: MaxSpeed
        concentration: *robotMaxSpeed
      - molecule: SafeMargin
        concentration: *robotSafeMargin
      - molecule: TargetID
        concentration: 2
      - molecule: TimeDistribution
        concentration: *timeDistribution
      - molecule: ControlPeriodMS
        concentration: *controlPeriodMS
    programs:
      - *program
    properties:
      - type: it.unibo.collektive.alchemist.device.sensors.impl.LocationSensorProperty
      - type: it.unibo.collektive.alchemist.device.sensors.impl.TimeSensorProperty
      - type: it.unibo.collektive.alchemist.device.sensors.impl.SolverProperty
        parameters: [ *QPSettings ]

  - type: Point
    parameters: [ 20, 20 ]
    contents:
      - molecule: Target
        concentration: 1

  - type: Point
    parameters: [ 0, 15 ]
    contents:
      - molecule: Target
        concentration: 2

  - type: Point
    parameters: [ 10, 10 ]
    contents:
      - molecule: Obstacle
        concentration: true
      - molecule: SafeRadius
        concentration: *obstacleRadius
      - molecule: SafeMargin
        concentration: *obstacleMargin

monitors:
  - type: it.unibo.alchemist.model.monitors.ExportDevicePositions
    parameters: [*seed, *dataPath]
  - type: it.unibo.alchemist.model.monitors.ExportObjectsPosition
    parameters: [*dataPath]

terminate:
  type: AfterTime
  parameters: 60.0